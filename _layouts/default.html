<meta name="theme-color" content="#0f172a">
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title | default: "Mehmet Karabulut — Petrol ve Doğalgaz Mühendisi" }}</title>

<!-- Favicon Dosyaları (Başlarına / eklendi) -->
<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicons/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/favicons/android-chrome-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/favicons/android-chrome-512x512.png">
<link rel="shortcut icon" href="/assets/favicons/favicon.ico">
<link rel="manifest" href="/assets/favicons/site.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ---------- Buton Tasarımları ---------- */
  .hero-buttons { 
    display: flex; 
    gap: 1rem; 
    margin-top: 2rem; 
    flex-wrap: wrap; 
  }
  .btn { 
    padding: 0.75rem 1.5rem; 
    border-radius: 8px; 
    font-family: var(--font-head); 
    font-weight: 600; 
    font-size: 1rem; 
    transition: all 0.2s ease; 
    display: inline-flex; 
    align-items: center; 
    justify-content: center; 
  }
  
  /* Birinci Buton (Dikkat Çekici Mavi) */
  .btn-primary { 
    background-color: var(--primary); 
    color: #ffffff; 
    border: 2px solid var(--primary); 
    box-shadow: var(--shadow-sm);
  }
  .btn-primary:hover { 
    background-color: var(--primary-hover); 
    border-color: var(--primary-hover); 
    transform: translateY(-2px); 
    box-shadow: var(--shadow-md);
  }
  
  /* İkinci Buton (Şeffaf / Kenarlıklı) */
  .btn-outline { 
    background-color: transparent; 
    color: var(--text-main); 
    border: 2px solid var(--text-main); 
  }
  .btn-outline:hover { 
    background-color: var(--text-main); 
    color: #ffffff; 
    transform: translateY(-2px); 
  }
  :root {
  --text-main: #1e293b; 
  --card-bg: #ffffff; 
    
    /* Aksan Rengi: Enerji ve doğalgazı simgeleyen bakır/turuncu dokunuş */
    --accent: #ea580c; 
    
    /* Metin Renkleri (Daha keskin okunabilirlik için) */
    --text-main: #0f172a; /* Çok koyu mat lacivert/siyah */
    --text-muted: #475569;
    
    /* Kart Yapıları */
    --card-bg: #ffffff;
    --card-border: rgba(0, 0, 0, 0.08); /* Çizgiler biraz daha belirgin */
    
    /* Gölgeler */
    --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.04);
    --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06);
    
    /* Tipografi */
    --font-head: 'Outfit', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'Space Mono', monospace;
    
    --radius-md: 12px;
    --radius-lg: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: var(--font-body); line-height: 1.7; -webkit-font-smoothing: antialiased; color: var(--text-main); }
  img { max-width: 100%; display: block; border-radius: var(--radius-md); }
  a { color: inherit; text-decoration: none; transition: all 0.2s ease; }
  h1, h2, h3 { font-family: var(--font-head); font-weight: 700; line-height: 1.2; color: var(--text-main); }
  p { margin-bottom: 1.2rem; font-size: 1.05rem; color: var(--text-muted); }
  strong { color: var(--text-main); font-weight: 600; }
  section { padding: 6rem 2rem 6rem calc(2rem + 240px); transition: background-color 0.3s ease; }
  .section-inner { max-width: 800px; margin: 0 auto; }
  h2.section-title { font-size: 2.2rem; margin-bottom: 2.5rem; position: relative; padding-bottom: 0.5rem; }
  h2.section-title::after { content: ''; position: absolute; left: 0; bottom: 0; width: 60px; height: 4px; background: var(--accent); border-radius: 2px; }
  
  /* ---------- BÖLÜM ARKA PLAN RENKLERİ ---------- */
  /* Profesyonel görünüm için sadece Beyaz ve Çok Açık Gri ardışık kullanılır */
  #hero { background-color: #f1f5f9; }      /* Slate 100 */
  #about { background-color: #f8fafc; }     /* Slate 50 */
  #experience { background-color: #f1f5f9; }  
  #projects { background-color: #f8fafc; }    
  #skills { background-color: #f1f5f9; }      
  #notes { background-color: #f8fafc; }       
  #interests { background-color: #f1f5f9; }  
  
  /* İletişim (Özel Koyu Tema) */
  #contact { 
    background-color: #0f172a; /* Sol menü ile aynı koyu mat lacivert */
    color: #ffffff; 
  }
  #contact h2.section-title { color: #ffffff; }
  #contact h2.section-title::after { background: var(--primary); } 
  #contact p { color: rgba(255, 255, 255, 0.8); }

  #rail { position: fixed; top: 0; left: 0; bottom: 0; width: 240px; background-color: #0f172a; box-shadow: 2px 0 10px rgba(0,0,0,0.1); z-index: 50; display: flex; flex-direction: column; justify-content: space-between; padding: 3rem 0; }
  #rail .rail-top { padding: 0 2rem; }
  #rail .rail-name { font-family: var(--font-head); font-size: 1.35rem; font-weight: 700; color: #ffffff; line-height: 1.2; }
  #rail .rail-role { font-size: 0.85rem; color: rgba(255,255,255,0.7); margin-top: 0.5rem; }
  #rail nav { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 0.5rem; padding: 0 1rem; margin-top: 1rem; }
  #rail .tick { display: flex; align-items: center; padding: 0.75rem 1rem; color: rgba(255,255,255,0.65); font-family: var(--font-head); font-size: 1rem; font-weight: 600; border-radius: var(--radius-md); transition: all 0.2s ease; }
  #rail .tick:hover { background: rgba(255,255,255,0.1); color: #ffffff; }
  #rail .tick.active { background: rgba(255,255,255,0.1); color: #ffffff; border-left: 3px solid var(--accent); padding-left: calc(1rem - 3px); }
  #rail .rail-bottom { padding: 0 2rem; font-size: 0.8rem; color: rgba(255,255,255,0.5); }

/* ---------- Mobile Top Bar ---------- */
  #mobile-bar {
    display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 60;
    background-color: #0f172a; color: #ffffff;
    align-items: center; justify-content: space-between;
    padding: 1rem 1.5rem; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  }
  #mobile-bar .cur { font-family: var(--font-head); font-weight: 700; font-size: 1.1rem; }
  #mobile-bar button {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: #ffffff;
    font-family: var(--font-head); font-weight: 600; font-size: 0.9rem; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer;
  }
  #mobile-menu {
    display: none; position: fixed; top: 60px; left: 0; right: 0; z-index: 59;
    background-color: #0f172a; padding: 0.5rem 0;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
  }
  #mobile-menu.open { display: block; }
  #mobile-menu a {
    display: block; color: #ffffff; font-weight: 500;
    padding: 1rem 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  @media (max-width: 1024px) {
    #rail { display: none; }
    #mobile-bar { display: flex; }
    section { padding: 5rem 1.5rem; padding-top: 6rem; }
  }

  #hero { min-height: 90vh; display: flex; align-items: center; }
  .hero-content { display: flex; align-items: center; gap: 3rem; }
  .hero-text { flex: 1; }
  .hero-image-container { flex-shrink: 0; width: 280px; height: 280px; border-radius: 50%; overflow: hidden; border: 4px solid #ffffff; box-shadow: var(--shadow-md); }
  .hero-image-container img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
  @media (max-width: 768px) { .hero-content { flex-direction: column-reverse; text-align: center; } .hero-image-container { width: 200px; height: 200px; margin: 0 auto; } #hero h1 { font-size: clamp(2.2rem, 8vw, 3rem); } }
  #hero h1 { font-size: clamp(2.5rem, 5vw, 4rem); letter-spacing: -1px; margin-bottom: 1rem; }
  #hero .role { font-size: 1.4rem; color: var(--primary); font-weight: 600; margin-bottom: 1.5rem; font-family: var(--font-head); }
  
  .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-lg); padding: 2.5rem; margin-bottom: 1.5rem; box-shadow: var(--shadow-sm); transition: transform 0.2s, box-shadow 0.2s; }
  .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
  .layer .when { font-family: var(--font-mono); font-size: 0.85rem; color: #000000; font-weight: 700; display: block; margin-bottom: 0.5rem; }
  .layer h3 { font-size: 1.3rem; margin-bottom: 0.25rem; }
  .layer .co { font-size: 1rem; font-weight: 600; color: var(--primary); margin-bottom: 1rem; }
  .proj h3 { font-size: 1.4rem; margin-bottom: 0.5rem; }
  .proj .role { font-family: var(--font-mono); font-size: 0.9rem; color: var(--primary); font-weight: 700; margin-bottom: 1rem; }
  .proj ul { padding-left: 1.2rem; color: var(--text-muted); margin-top: 1rem; }
  .proj li { margin-bottom: 0.5rem; }
  .legend-group { margin-bottom: 2.5rem; }
  .legend-group h4 { font-family: var(--font-head); font-size: 1.1rem; color: var(--text-main); margin-bottom: 1rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .chip { background: var(--card-bg); border: 1px solid var(--card-border); padding: 0.5rem 1rem; font-size: 0.9rem; color: var(--text-main); font-weight: 500; border-radius: 8px; box-shadow: var(--shadow-sm); }
  .interests-list { list-style: none; margin-top: 1.5rem; }
  .interests-list li { position: relative; padding-left: 1.5rem; margin-bottom: 1rem; font-size: 1.05rem; color: var(--text-muted); }
  .interests-list li::before { content: '•'; color: var(--primary); font-size: 1.5rem; position: absolute; left: 0; top: -4px; }
  .contact-links { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; margin-top: 2rem; }
  .contact-links a { display: flex; align-items: center; gap: 1rem; background: rgba(255, 255, 255, 0.05); padding: 1.25rem; border-radius: var(--radius-md); border: 1px solid rgba(255, 255, 255, 0.1); color: #ffffff; font-weight: 500; box-shadow: var(--shadow-sm); }
  .contact-links a:hover { border-color: #6ee7b7; background: rgba(255, 255, 255, 0.1); }
  .contact-links svg { width: 24px; height: 24px; flex-shrink: 0; color: #6ee7b7; }
  footer { margin-top: 4rem; text-align: center; font-family: var(--font-mono); font-size: 0.85rem; color: rgba(255, 255, 255, 0.6); padding-bottom: 2rem;}

  /* Makale Sayfası İçin Ekstra Stil */
  .post-content { padding: 4rem 2rem 4rem calc(2rem + 240px); max-width: 900px; }
  .post-content h1 { font-size: 2.5rem; margin-bottom: 1rem; }
  .post-content .post-meta { font-family: var(--font-mono); font-size: 0.9rem; color: var(--text-muted); margin-bottom: 2rem; display: block; }
  @media (max-width: 1024px) { .post-content { padding: 6rem 1.5rem 4rem 1.5rem; } }
</style>
</head>
<body>

<div id="mobile-bar">
  <span class="cur" id="curLabel">Giriş</span>
  <button id="menuBtn">MENÜ</button>
</div>
<div id="mobile-menu"></div>

<aside id="rail">
  <div class="rail-top">
    <div class="rail-name">Mehmet<br>Karabulut</div>
    <div class="rail-role">Petrol ve Doğalgaz Mühendisi</div>
  </div>
  <nav id="railNav"></nav>
  <div class="rail-bottom">Ankara, Türkiye</div>
</aside>

<main>
  <!-- SİHİRLİ BÖLÜM: Ana sayfadaysa normal göster, makaledeyse tasarımlı göster -->
  {% if page.is_home %}
    {{ content }}
  {% else %}
    <article class="post-content">
      <h1>{{ page.title }}</h1>
      <span class="post-meta">{{ page.date | date: "%d.%m.%Y" }}</span>
      <div style="margin-top: 2rem; font-size: 1.1rem; line-height: 1.8;">
        {{ content }}
      </div>
    </article>
  {% endif %}

  <!-- İletişim Bölümü Tüm Sayfaların En Altında Çıkar -->
  {% include contact.html %}
</main>

<script>
  const mobileMenu = document.getElementById('mobile-menu');
  const railNav = document.getElementById('railNav');
  const curLabel = document.getElementById('curLabel');

  document.getElementById('menuBtn').addEventListener('click', () => {
    mobileMenu.classList.toggle('open');
  });
  mobileMenu.addEventListener('click', (e) => {
    if(e.target.closest('a')) mobileMenu.classList.remove('open');
  });

  // EĞER ANA SAYFADAYSAK NORMAL MENÜYÜ ÇALIŞTIR
  {% if page.is_home %}
  const sections = Array.from(document.querySelectorAll('main > section'));
  sections.forEach(sec => {
    const label = sec.getAttribute('data-label');
    const id = sec.id;
    const tick = document.createElement('a');
    tick.className = 'tick';
    tick.href = '#' + id;
    tick.innerHTML = `<span>${label}</span>`;
    railNav.appendChild(tick);
    
    const mItem = document.createElement('a');
    mItem.href = '#' + id;
    mItem.innerHTML = `<span>${label}</span>`;
    mobileMenu.appendChild(mItem);
  });

  const ticks = Array.from(document.querySelectorAll('#rail .tick'));
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        const id = entry.target.id;
        const label = entry.target.getAttribute('data-label');
        ticks.forEach(t => t.classList.toggle('active', t.getAttribute('href') === '#' + id));
        curLabel.textContent = label;
      }
    });
  }, { rootMargin: '-45% 0px -45% 0px' });
  sections.forEach(sec => observer.observe(sec));
  
  // EĞER MAKALE SAYFASINDAYSAK MENÜYE "ANA SAYFAYA DÖN" BUTONU EKLE
  {% else %}
  railNav.innerHTML = `<a class="tick" href="/"><span>← Ana Sayfaya Dön</span></a>`;
  mobileMenu.innerHTML = `<a href="/"><span>← Ana Sayfaya Dön</span></a>`;
  curLabel.textContent = "Makale";
  {% endif %}
</script>

</body>
</html>
